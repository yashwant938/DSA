<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="454" viewBox="0 0 1120 454" role="img" aria-labelledby="title desc">
<title id="title">Spiral traversal of a four-by-four matrix</title>
<desc id="desc">A raised matrix numbered by rows. A copper line visits 1, 2, 3, 4, 8, 12, 16, 15, 14, 13, 9, 5, 6, 7, 11, 10.</desc>
<defs>
  <pattern id="paper-grid" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a7aea0"/></pattern>
  <g id="tile" stroke="#4d6860" stroke-linejoin="round" stroke-width="1.5">
    <path d="M -64,0 0,31 0,43 -64,12 Z" fill="#b2c4b4"/>
    <path d="M 0,31 64,0 64,12 0,43 Z" fill="#86a89c"/>
    <path d="M 0,-31 64,0 0,31 -64,0 Z" fill="#f3ecd9"/>
    <path d="M -56,1 0,28 55,2" fill="none" stroke="#fffaf0" stroke-width="1"/>
  </g>
</defs>

<rect x="0" y="0" width="1120" height="454" rx="16" fill="#f5f0e5"/>
<rect x="486" y="42" width="611" height="357" rx="0" fill="url(#paper-grid)"/>
<text x="45" y="53" fill="#24655e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.4">ARRAYS  /  4 × 4 MATRIX</text>
<text x="41" y="147" fill="#203332" font-family="Georgia, 'Times New Roman', serif" font-size="79" font-weight="400" >Spiral</text>
<text x="42" y="219" fill="#24655e" font-family="Georgia, 'Times New Roman', serif" font-size="77" font-weight="400" font-style="italic">traversal</text>
<text x="46" y="264" fill="#203332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="400" >Walk the outer ring, then step inward.</text>
<path d="M46 301H465" stroke="#b3beaf"/>
<text x="46" y="331" fill="#24655e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.4">TRAVERSAL OUTPUT</text>
<text x="46" y="367" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="500" xml:space="preserve"> 1   2   3   4   8  12  16  15</text>
<text x="46" y="399" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="500" xml:space="preserve">14  13   9   5   6   7  11  10</text>
