<svg xmlns="http://www.w3.org/2000/svg" width="540" height="276" viewBox="0 0 540 276" role="img" aria-labelledby="title desc">
<title id="title">Breadth-first search from node zero</title>
<desc id="desc">Zero links to one and two; one links to three, and two links to four. The queue after visiting zero is [1, 2].</desc>
<rect x="0" y="0" width="540" height="276" rx="13" fill="#f2efe5"/>
<rect x="12" y="12" width="516" height="252" rx="8" fill="none"/>
<text x="23" y="44" fill="#203332" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" >Breadth-first search</text>
<text x="24" y="73" fill="#24655e" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="400" >Start at node 0 and visit its neighbors in order.</text>
<path d="M66 157 L182 116" stroke="#24655e" stroke-width="3"/>
<path d="M66 157 L182 197" stroke="#24655e" stroke-width="3"/>
<path d="M182 116 L301 113" stroke="#9aa99c" stroke-width="3"/>
<path d="M182 197 L301 194" stroke="#9aa99c" stroke-width="3"/>
<path d="M43,154 a23,13 0 0 1 46,0 v8 a23,13 0 0 1 -46,0 z" fill="#a75436" stroke="#4a6457" stroke-width="1.4"/>
<ellipse cx="66" cy="154" rx="23" ry="13" fill="#ffd0a5" stroke="#4a6457" stroke-width="1.4"/>
<text x="66" y="159" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">0</text>
<path d="M159,113 a23,13 0 0 1 46,0 v8 a23,13 0 0 1 -46,0 z" fill="#658d79" stroke="#4a6457" stroke-width="1.4"/>
<ellipse cx="182" cy="113" rx="23" ry="13" fill="#d7e7cd" stroke="#4a6457" stroke-width="1.4"/>
<text x="182" y="118" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">1</text>
<path d="M159,194 a23,13 0 0 1 46,0 v8 a23,13 0 0 1 -46,0 z" fill="#658d79" stroke="#4a6457" stroke-width="1.4"/>
<ellipse cx="182" cy="194" rx="23" ry="13" fill="#d7e7cd" stroke="#4a6457" stroke-width="1.4"/>
<text x="182" y="199" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">2</text>
<path d="M278,110 a23,13 0 0 1 46,0 v8 a23,13 0 0 1 -46,0 z" fill="#a7b5a4" stroke="#4a6457" stroke-width="1.4"/>
<ellipse cx="301" cy="110" rx="23" ry="13" fill="#ece8d8" stroke="#4a6457" stroke-width="1.4"/>
<text x="301" y="115" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">3</text>
<path d="M278,191 a23,13 0 0 1 46,0 v8 a23,13 0 0 1 -46,0 z" fill="#a7b5a4" stroke="#4a6457" stroke-width="1.4"/>
<ellipse cx="301" cy="191" rx="23" ry="13" fill="#ece8d8" stroke="#4a6457" stroke-width="1.4"/>
<text x="301" y="196" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">4</text>
<text x="365" y="130" fill="#24655e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1">QUEUE</text>
<text x="365" y="162" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="27" font-weight="700" >[1, 2]</text>
<text x="365" y="189" fill="#203332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400" >After visiting 0</text>
<path d="M23 235h494" stroke="#c1c9b9"/>
<text x="24" y="260" fill="#24655e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" >Visit order        0 → 1 → 2 → 3 → 4</text>
</svg>
