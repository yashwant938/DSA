<svg xmlns="http://www.w3.org/2000/svg" width="700" height="315" viewBox="0 0 700 315" role="img" aria-labelledby="title desc">
  <title id="title">Night service from Hill Road to Night Market</title>
  <desc id="desc">Local tracks join 0–1, 1–3, 3–5, 0–2, 2–4 and 4–3. The express track from 2 to 5 closes at midnight.</desc>
