<svg xmlns="http://www.w3.org/2000/svg" width="550" height="722" viewBox="0 0 550 722" role="img" aria-labelledby="title desc">
<title id="title">Spiral traversal of a four-by-four matrix</title>
<desc id="desc">A raised matrix numbered by rows. A copper line visits 1, 2, 3, 4, 8, 12, 16, 15, 14, 13, 9, 5, 6, 7, 11, 10.</desc>
<defs>
  <pattern id="paper-grid" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a7aea0"/></pattern>
  <g id="tile" stroke="#4d6860" stroke-linejoin="round" stroke-width="1.5">
    <path d="M -64,0 0,31 0,43 -64,12 Z" fill="#b2c4b4"/>
    <path d="M 0,31 64,0 64,12 0,43 Z" fill="#86a89c"/>
    <path d="M 0,-31 64,0 0,31 -64,0 Z" fill="#f3ecd9"/>
    <path d="M -56,1 0,28 55,2" fill="none" stroke="#fffaf0" stroke-width="1"/>
  </g>
</defs>
<style>
  .trace { stroke-dasharray:1; animation: visit 9s linear infinite; }
  @keyframes visit { 0%,9% {stroke-dashoffset:1} 78%,100% {stroke-dashoffset:0} }
  @media (prefers-reduced-motion:reduce) { .trace {animation:none;stroke-dashoffset:0} .runner {display:none} }
</style>
<rect x="0" y="0" width="550" height="722" rx="16" fill="#f5f0e5"/>
<text x="29" y="38" fill="#24655e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.4">ARRAYS  /  4 × 4 MATRIX</text>
<text x="26" y="101" fill="#203332" font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="400" >Spiral traversal</text>
<text x="29" y="142" fill="#203332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="400" >Walk the outer ring, then step inward.</text>
<rect x="18" y="173" width="514" height="319" rx="0" fill="url(#paper-grid)"/>
<g transform="translate(275 217) scale(.83)">
<polygon points="4,-15 297,127 4,269 -289,127" fill="#c6c6b6" opacity=".57"/>
<polygon points="-293,102 0,244 0,264 -293,122" fill="#78918b" />
<polygon points="293,102 0,244 0,264 293,122" fill="#4b6a64" />
<polygon points="0,-40 293,102 0,244 -293,102" fill="#b7c6bb" stroke="#38534e" stroke-width="1.5"/>
<use href="#tile" x="0" y="0"/>
<text x="0" y="12" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">1</text>
<use href="#tile" x="70" y="34"/>
<text x="70" y="46" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">2</text>
<use href="#tile" x="-70" y="34"/>
<text x="-70" y="46" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">5</text>
<use href="#tile" x="140" y="68"/>
<text x="140" y="80" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">3</text>
<use href="#tile" x="-140" y="68"/>
<text x="-140" y="80" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">9</text>
<use href="#tile" x="0" y="68"/>
<text x="0" y="80" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">6</text>
<use href="#tile" x="210" y="102"/>
<text x="210" y="114" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">4</text>
<use href="#tile" x="-210" y="102"/>
<text x="-210" y="114" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">13</text>
<use href="#tile" x="70" y="102"/>
<text x="70" y="114" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">7</text>
<use href="#tile" x="-70" y="102"/>
<text x="-70" y="114" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">10</text>
<use href="#tile" x="140" y="136"/>
<text x="140" y="148" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">8</text>
<use href="#tile" x="-140" y="136"/>
<text x="-140" y="148" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">14</text>
<use href="#tile" x="0" y="136"/>
<text x="0" y="148" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">11</text>
<use href="#tile" x="70" y="170"/>
<text x="70" y="182" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">12</text>
<use href="#tile" x="-70" y="170"/>
<text x="-70" y="182" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">15</text>
<use href="#tile" x="0" y="204"/>
<text x="0" y="216" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700" text-anchor="middle">16</text>
<path d="M0,-13 L70,21 L140,55 L210,89 L140,123 L70,157 L0,191 L-70,157 L-140,123 L-210,89 L-140,55 L-70,21 L0,55 L70,89 L0,123 L-70,89" fill="none" stroke="#bd785b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M0,-13 L70,21 L140,55 L210,89 L140,123 L70,157 L0,191 L-70,157 L-140,123 L-210,89 L-140,55 L-70,21 L0,55 L70,89 L0,123 L-70,89" class="trace" pathLength="1" fill="none" stroke="#ad4226" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="0" cy="-13" r="5" fill="#f5f0e5" stroke="#ac4025" stroke-width="2.7"/>
<circle cx="-70" cy="89" r="5" fill="#f5f0e5" stroke="#ac4025" stroke-width="2.7"/>
<g class="runner">
<animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.09;0.78;1" keyPoints="0;0;1;1" path="M0,-13 L70,21 L140,55 L210,89 L140,123 L70,157 L0,191 L-70,157 L-140,123 L-210,89 L-140,55 L-70,21 L0,55 L70,89 L0,123 L-70,89"/>
<circle r="9" fill="#ffcb9b" stroke="#93391f" stroke-width="2"/><circle r="3.5" fill="#96371f"/>
</g>
</g>
<g transform="translate(203 487)">
<path d="M0 0 h29" stroke="#ac4025" stroke-width="3.5" stroke-linecap="round"/>
<text x="40" y="5" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="400" >Visit order</text>
</g>
<path d="M29 522H521" stroke="#bdc5b7"/>
<text x="29" y="559" fill="#24655e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.4">TRAVERSAL OUTPUT</text>
<text x="29" y="599" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="500" xml:space="preserve"> 1   2   3   4   8  12  16  15</text>
<text x="29" y="640" fill="#203332" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="500" xml:space="preserve">14  13   9   5   6   7  11  10</text>
<text x="29" y="690" fill="#24655e" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="400" >Clockwise from the top-left cell.</text>
</svg>
